<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AWS Assessment Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e6eaf0;--brand:#5b5cf0;--brand2:#7c3aed;--good:#087443;--danger:#b42318;--shadow:0 14px 40px #10182812}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8f9ff,#f5f7fb);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text)}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.shell{max-width:1180px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.brand{font-weight:800;font-size:20px}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.metric{font-size:32px;font-weight:850;margin-top:5px}.btn{padding:11px 15px;border-radius:12px;background:var(--brand);color:#fff;font-weight:700}.btn.secondary{background:#eef0ff;color:#4144c8}.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}.btn.danger{background:#fee4e2;color:#b42318}.actions{display:flex;gap:8px;flex-wrap:wrap}.field{margin:12px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px 13px;border:1px solid #d7dce5;border-radius:11px;background:#fff}.two{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.drop{border:2px dashed #cbd2e1;border-radius:16px;padding:25px;text-align:center;background:#fafbff}.status{padding:10px 12px;border-radius:10px;background:#f2f4f7;color:#344054}.status.good{background:#ecfdf3;color:#087443}.status.bad{background:#fef3f2;color:#b42318}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eef0ff;color:#4144c8;font-size:12px;font-weight:800}.assessment{display:flex;justify-content:space-between;gap:18px;align-items:center}.assessment h3{margin:0 0 6px}.stats{display:flex;gap:20px;flex-wrap:wrap;color:#475467;font-size:14px}.qrow{padding:14px 0;border-top:1px solid var(--line)}.qrow:first-child{border-top:0}.qtext{font-weight:700}.option{font-size:13px;color:#475467;margin-top:4px}.hidden{display:none!important}.center{text-align:center}.candidate{max-width:820px;margin:30px auto}.choice{border:1px solid var(--line);padding:16px;border-radius:14px;margin:10px 0;background:#fff}.choice:hover{border-color:#9da1ff}.timer{font-size:26px;font-weight:900}.progress{height:8px;background:#e9edf4;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;color:#667085;text-transform:uppercase}.notice{padding:12px;border-radius:12px;background:#fff7ed;color:#9a3412}.small{font-size:13px}.title{font-size:30px;margin:0 0 5px}@media(max-width:700px){.two,.three{grid-template-columns:1fr}.assessment{align-items:flex-start;flex-direction:column}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><div id="app"></div>
<script>
const SUPABASE_URL = "https://ntmmzjkxojfxltxwyspy.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_wMwwsFep5ZjbqNi5UbWi5w_g9-GEASa";
const sb = (window.supabase && SUPABASE_ANON_KEY !== "YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY") ? window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY) : null;
const state={assessment:null,questions:[],answers:[],index:0,name:'',startedAt:null,timer:null,submitted:false,adminUser:null};
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const slug=s=>s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,70);
function toast(msg,bad=false){const el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.className='status '+(bad?'bad':'good');el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),4500)}
function needSb(){if(!sb){toast('Add your Supabase publishable/anon key in index.html first.',true);return false}return true}
async function adminCheck(){if(!needSb())return null;const {data:{user},error}=await sb.auth.getUser();if(error||!user)return null;const {data:role,error:e}=await sb.from('staff_roles').select('role').eq('user_id',user.id).eq('role','admin').maybeSingle();if(e)throw e;if(!role)return null;return user}
function adminShell(body){return `<div class="shell"><div class="top"><div><div class="brand">AWS Assessment Manager</div><div class="muted small">Admin control center</div></div><div class="actions"><button class="btn ghost" onclick="location.href=location.pathname">Candidate</button><button class="btn ghost" onclick="signOut()">Sign out</button></div></div><div id="toast" class="status hidden"></div>${body}</div>`}
async function signOut(){await sb.auth.signOut();location.reload()}
async function adminPage(){if(!needSb())return renderLogin();let user;try{user=await adminCheck()}catch(e){return renderError('Admin verification failed: '+e.message)}if(!user)return renderLogin();state.adminUser=user;renderAdmin();}
function renderLogin(){document.getElementById('app').innerHTML=`<div class="shell"><div class="candidate"><div class="card"><div class="badge">ADMIN</div><h1 class="title">Administrator sign in</h1><p class="muted">Use the Supabase Auth account that has role <b>admin</b> in <code>staff_roles</code>.</p><div class="field"><label>Email</label><input id="aemail" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="apass" type="password" autocomplete="current-password"></div><button class="btn" onclick="loginAdmin()">Sign in</button><div id="loginmsg" class="status hidden" style="margin-top:12px"></div></div></div></div>`}
async function loginAdmin(){const msg=document.getElementById('loginmsg');msg.classList.remove('hidden');msg.textContent='Signing in…';const {error}=await sb.auth.signInWithPassword({email:document.getElementById('aemail').value.trim(),password:document.getElementById('apass').value});if(error){msg.className='status bad';msg.textContent=error.message;return}location.reload()}
async function getAssessments(){const {data,error}=await sb.from('assessments').select('*').order('created_at',{ascending:false});if(error)throw error;return data||[]}
async function getCounts(ids){if(!ids.length)return {};const {data,error}=await sb.from('assessment_responses').select('assessment_id,percentage').in('assessment_id',ids);if(error)throw error;const out={};(data||[]).forEach(r=>{out[r.assessment_id]??={count:0,total:0};out[r.assessment_id].count++;out[r.assessment_id].total+=Number(r.percentage||0)});return out}
function renderAdmin(){loadAdminData().catch(e=>renderError('Could not load admin dashboard: '+e.message))}
async function loadAdminData(){const as=await getAssessments();const counts=await getCounts(as.map(a=>a.id));document.getElementById('app').innerHTML=adminShell(`<div class="card"><div class="top"><div><div class="badge">ASSESSMENT MANAGER</div><h1 class="title">Create and manage assessments</h1><div class="muted">Upload a PDF or Word question bank, configure the attempt, then publish.</div></div><button class="btn" onclick="openCreate()">+ Create assessment</button></div></div><div class="grid" id="metrics"></div><div class="card"><div class="top"><div><h2>Assessments</h2><div class="muted small">Each assessment has its own response count and Excel export.</div></div><button class="btn ghost" onclick="loadAdminData()">Refresh</button></div><div id="alist"></div></div>`);let total=0;Object.values(counts).forEach(x=>total+=x.count);document.getElementById('metrics').innerHTML=`<div class="card"><div class="muted">Total responses</div><div class="metric">${total}</div></div><div class="card"><div class="muted">Published assessments</div><div class="metric">${as.filter(a=>a.published).length}</div></div><div class="card"><div class="muted">Question banks</div><div class="metric">${as.reduce((n,a)=>n+Number(a.question_count||0),0)}</div></div>`;document.getElementById('alist').innerHTML=as.length?as.map(a=>{const c=counts[a.id]||{count:0,total:0};const avg=c.count?Math.round(c.total/c.count):0;return `<div class="card assessment"><div><div class="badge">${a.published?'PUBLISHED':'DRAFT'}</div><h3>${esc(a.name)}</h3><div class="stats"><span>${a.question_count} questions</span><span>${a.questions_per_attempt} / attempt</span><span>${a.time_limit_minutes} min</span><span>${a.benchmark_percentage}% benchmark</span><span><b>${c.count}</b> responses</span><span>${avg}% avg</span></div></div><div class="actions"><button class="btn ghost" onclick="viewResponses('${a.id}')">Responses</button><button class="btn secondary" onclick="downloadExcel('${a.id}')">Excel</button><button class="btn ghost" onclick="editAssessment('${a.id}')">Manage</button></div></div>`}).join(''):`<div class="notice">No assessments yet. Click <b>Create assessment</b>.</div>`}
function openCreate(){document.getElementById('app').innerHTML=adminShell(`<div class="card"><div class="badge">NEW ASSESSMENT</div><h1 class="title">Create assessment</h1><div class="two"><div class="field"><label>Assessment name</label><input id="aname" placeholder="AWS Certified Cloud Practitioner"></div><div class="field"><label>Slug</label><input id="aslug" placeholder="aws-certified-cloud-practitioner"></div></div><div class="field"><label>Description</label><textarea id="adesc" rows="2" placeholder="Developer assessment"></textarea></div><div class="drop"><input id="bankfile" type="file" accept=".docx,.pdf" onchange="parseUpload(this.files[0])"><div class="muted small" style="margin-top:8px">Accepted: .DOCX or .PDF. The browser extracts the question text; the uploaded document itself is not stored.</div></div><div id="parseStatus" class="status hidden" style="margin-top:12px"></div><div class="three"><div class="field"><label>Questions per attempt</label><input id="qpa" type="number" min="1" value="50"></div><div class="field"><label>Time limit (minutes)</label><input id="mins" type="number" min="1" value="60"></div><div class="field"><label>Benchmark (%)</label><input id="bench" type="number" min="0" max="100" value="80"></div></div><div class="actions"><label><input id="shuffleQ" type="checkbox" checked> Shuffle questions</label><label><input id="shuffleO" type="checkbox" checked> Shuffle options</label></div><div id="preview" class="card hidden" style="margin-top:16px;box-shadow:none"></div><div class="actions"><button class="btn ghost" onclick="renderAdmin()">Cancel</button><button class="btn secondary" onclick="previewParsed()">Preview</button><button class="btn" onclick="publishNew()">Publish assessment</button></div></div>`)}
let parsedQuestions=[];
async function parseUpload(file){if(!file)return;const st=document.getElementById('parseStatus');st.className='status';st.textContent='Reading question bank…';st.classList.remove('hidden');try{let text='';if(file.name.toLowerCase().endsWith('.docx')){const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});text=r.value}else if(file.name.toLowerCase().endsWith('.pdf')){const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p);const tc=await page.getTextContent();text+='\n'+tc.items.map(x=>x.str).join(' ')}}parsedQuestions=parseQuestions(text);st.className=parsedQuestions.length?'status good':'status bad';st.textContent=parsedQuestions.length?`✓ ${parsedQuestions.length} questions detected`:'No valid questions detected. Use numbered questions with A/B/C/D and Answer: X.';if(parsedQuestions.length&&!document.getElementById('aname').value)document.getElementById('aname').value=file.name.replace(/\.(docx|pdf)$/i,'')}catch(e){st.className='status bad';st.textContent='Could not read file: '+e.message}}
function parseQuestions(text){text=text.replace(/\r/g,'').replace(/[ \t]+/g,' ').replace(/\n +/g,'\n');let blocks=[];const numbered=[...text.matchAll(/(?:^|\n)\s*(\d+)\.\s*/g)];if(numbered.length>=2){for(let i=0;i<numbered.length;i++){const start=numbered[i].index+(text[numbered[i].index]==='\n'?1:0);const end=i+1<numbered.length?numbered[i+1].index:text.length;blocks.push(text.slice(start,end))}}else{blocks=text.split(/\n\s*\n/)}const out=[];for(const b of blocks){const q=b.replace(/^\s*\d+\.\s*/,'').match(/^(.*?)\s+A\.\s*(.*?)\s+B\.\s*(.*?)\s+C\.\s*(.*?)\s+D\.\s*(.*?)\s+Answer:\s*([ABCD])/is);if(!q)continue;out.push({question:q[1].trim(),options:[q[2],q[3],q[4],q[5]].map(x=>x.trim()),answer:'ABCD'.indexOf(q[6].toUpperCase())})}return out}
function previewParsed(){const p=document.getElementById('preview');if(!parsedQuestions.length){p.classList.remove('hidden');p.innerHTML='<div class="notice">Upload a valid question bank first.</div>';return}p.classList.remove('hidden');p.innerHTML=`<h3>Preview (${parsedQuestions.length})</h3>`+parsedQuestions.slice(0,5).map((q,i)=>`<div class="qrow"><div class="qtext">${i+1}. ${esc(q.question)}</div>${q.options.map((o,j)=>`<div class="option">${'ABCD'[j]}. ${esc(o)}</div>`).join('')}<div class="small muted">Answer: ${'ABCD'[q.answer]}</div></div>`).join('')+(parsedQuestions.length>5?`<div class="muted small">Showing first 5. All ${parsedQuestions.length} will be imported.</div>`:'')}
async function publishNew(){if(!parsedQuestions.length)return toast('Upload a valid question bank first.',true);const name=document.getElementById('aname').value.trim();if(!name)return toast('Enter an assessment name.',true);const qpa=Number(document.getElementById('qpa').value),mins=Number(document.getElementById('mins').value),bench=Number(document.getElementById('bench').value);if(qpa<1||qpa>parsedQuestions.length||mins<1||bench<0||bench>100)return toast('Check the assessment settings.',true);const s=slug(document.getElementById('aslug').value.trim()||name);try{const {data:a,error}=await sb.from('assessments').insert({slug:s,name,description:document.getElementById('adesc').value.trim(),question_count:parsedQuestions.length,questions_per_attempt:qpa,time_limit_minutes:mins,benchmark_percentage:bench,shuffle_questions:document.getElementById('shuffleQ').checked,shuffle_options:document.getElementById('shuffleO').checked,published:true}).select().single();if(error)throw error;const rows=parsedQuestions.map((q,i)=>({assessment_id:a.id,question_number:i+1,question:q.question,option_a:q.options[0],option_b:q.options[1],option_c:q.options[2],option_d:q.options[3],correct_answer:q.answer,difficulty:'intermediate'}));for(let i=0;i<rows.length;i+=100){const {error:e}=await sb.from('assessment_questions').insert(rows.slice(i,i+100));if(e)throw e}toast('Assessment published.');renderAdmin()}catch(e){toast(e.message,true)}}
async function editAssessment(id){const {data:a,error}=await sb.from('assessments').select('*').eq('id',id).single();if(error)return toast(error.message,true);document.getElementById('app').innerHTML=adminShell(`<div class="card"><div class="badge">MANAGE</div><h1 class="title">${esc(a.name)}</h1><div class="three"><div class="field"><label>Questions per attempt</label><input id="eqpa" type="number" value="${a.questions_per_attempt}"></div><div class="field"><label>Time limit (minutes)</label><input id="emins" type="number" value="${a.time_limit_minutes}"></div><div class="field"><label>Benchmark (%)</label><input id="ebench" type="number" min="0" max="100" value="${a.benchmark_percentage}"></div></div><div class="actions"><label><input id="eshq" type="checkbox" ${a.shuffle_questions?'checked':''}> Shuffle questions</label><label><input id="esho" type="checkbox" ${a.shuffle_options?'checked':''}> Shuffle options</label><label><input id="epub" type="checkbox" ${a.published?'checked':''}> Published</label></div><div class="actions" style="margin-top:16px"><button class="btn ghost" onclick="renderAdmin()">Back</button><button class="btn" onclick="saveAssessment('${id}')">Save settings</button></div></div>`)}
async function saveAssessment(id){const patch={questions_per_attempt:Number(document.getElementById('eqpa').value),time_limit_minutes:Number(document.getElementById('emins').value),benchmark_percentage:Number(document.getElementById('ebench').value),shuffle_questions:document.getElementById('eshq').checked,shuffle_options:document.getElementById('esho').checked,published:document.getElementById('epub').checked,updated_at:new Date().toISOString()};const {error}=await sb.from('assessments').update(patch).eq('id',id);if(error)return toast(error.message,true);toast('Saved.');renderAdmin()}
async function viewResponses(id){const {data:a}=await sb.from('assessments').select('name').eq('id',id).single();const {data:r,error}=await sb.from('assessment_responses').select('*').eq('assessment_id',id).order('completed_at',{ascending:false});if(error)return toast(error.message,true);document.getElementById('app').innerHTML=adminShell(`<div class="card"><div class="top"><div><div class="badge">RESPONSES</div><h1 class="title">${esc(a?.name||'Assessment')}</h1><div class="muted"><b>${r.length}</b> responses</div></div><div class="actions"><button class="btn secondary" onclick="downloadExcel('${id}')">Download Excel</button><button class="btn ghost" onclick="renderAdmin()">Back</button></div></div><div class="tablewrap"><table><thead><tr><th>Candidate</th><th>Score</th><th>%</th><th>Duration</th><th>Completed</th><th>Auto</th></tr></thead><tbody>${r.map(x=>`<tr><td>${esc(x.full_name)}</td><td>${x.score}/${x.question_count}</td><td>${x.percentage}%</td><td>${Math.floor(x.duration_seconds/60)}m ${x.duration_seconds%60}s</td><td>${new Date(x.completed_at).toLocaleString()}</td><td>${x.auto_submitted?'Yes':'No'}</td></tr>`).join('')}</tbody></table></div></div>`)}
async function downloadExcel(id){const {data:a}=await sb.from('assessments').select('name').eq('id',id).single();const {data:r,error}=await sb.from('assessment_responses').select('full_name,score,percentage,question_count,started_at,completed_at,duration_seconds,auto_submitted').eq('assessment_id',id).order('completed_at',{ascending:false});if(error)return toast(error.message,true);if(!r.length)return toast('No responses for this assessment yet.',true);const rows=r.map(x=>({'Candidate':x.full_name,'Score':`${x.score}/${x.question_count}`,'Percentage':x.percentage,'Started':x.started_at,'Completed':x.completed_at,'Duration (seconds)':x.duration_seconds,'Auto submitted':x.auto_submitted?'Yes':'No'}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Responses');XLSX.writeFile(wb,`${slug(a?.name||'assessment')}-responses.xlsx`)}
function renderError(m){document.getElementById('app').innerHTML=`<div class="shell"><div class="card"><div class="status bad">${esc(m)}</div></div></div>`}
async function candidateHome(){if(!needSb())return renderError('Add your Supabase publishable/anon key in index.html.');const {data,error}=await sb.from('assessments').select('*').eq('published',true).order('name');if(error)return renderError(error.message);document.getElementById('app').innerHTML=`<div class="shell"><div class="top"><div><div class="brand">AWS Developer Assessments</div><div class="muted">Choose an assessment</div></div><button class="btn ghost" onclick="location.search='?admin=1'">Admin</button></div><div class="grid">${data.map(a=>`<div class="card"><div class="badge">ASSESSMENT</div><h2>${esc(a.name)}</h2><p class="muted">${esc(a.description||'')}</p><div class="stats"><span>${a.question_count} questions</span><span>${a.questions_per_attempt} / attempt</span><span>${a.time_limit_minutes} min</span><span>${a.benchmark_percentage}% benchmark</span></div><button class="btn" style="margin-top:16px" onclick="startAssessment('${a.id}')">Start assessment</button></div>`).join('')}</div></div>`}
async function startAssessment(id){const {data:a,error}=await sb.from('assessments').select('*').eq('id',id).eq('published',true).single();if(error)return toast(error.message,true);const {data:qs,error:e}=await sb.from('assessment_questions').select('*').eq('assessment_id',id).order('question_number');if(e)return toast(e.message,true);if(!qs||qs.length<a.questions_per_attempt)return toast('This assessment does not have enough questions.',true);state.assessment=a;state.questions=[...qs];if(a.shuffle_questions)state.questions.sort(()=>Math.random()-.5);state.questions=state.questions.slice(0,a.questions_per_attempt);state.questions=state.questions.map(q=>{let opts=[q.option_a,q.option_b,q.option_c,q.option_d],answer=q.correct_answer;if(a.shuffle_options){const pairs=opts.map((o,i)=>({o,i})).sort(()=>Math.random()-.5);answer=pairs.findIndex(x=>x.i===answer);opts=pairs.map(x=>x.o)}return {...q,options:opts,answer}});state.answers=[];state.index=0;state.name='';state.startedAt=null;state.submitted=false;renderStart()}
function renderStart(){const a=state.assessment;document.getElementById('app').innerHTML=`<div class="candidate shell"><div class="card"><div class="badge">ASSESSMENT</div><h1 class="title">${esc(a.name)}</h1><p class="muted">${esc(a.description||'')}</p><div class="stats"><span>${a.questions_per_attempt} questions</span><span>${a.time_limit_minutes} minutes</span><span>${a.benchmark_percentage}% benchmark</span></div><div class="field"><label>Full name</label><input id="candidateName" placeholder="Enter your full name"></div><button class="btn" onclick="beginAssessment()">Begin assessment</button></div></div>`}
function beginAssessment(){const n=document.getElementById('candidateName').value.trim();if(!n)return toast('Enter your full name.',true);state.name=n;state.startedAt=Date.now();renderQuestion();}
function renderQuestion(){const a=state.assessment,q=state.questions[state.index],answered=state.answers.filter(x=>x!==undefined).length;const pct=(state.index+1)/state.questions.length*100;document.getElementById('app').innerHTML=`<div class="shell candidate"><div class="top"><div><div class="brand">${esc(a.name)}</div><div class="muted">${answered}/${a.questions_per_attempt} answered</div></div><div id="timer" class="timer"></div></div><div class="progress"><div style="width:${pct}%"></div></div><div class="card"><div class="muted">Question ${state.index+1} of ${state.questions.length}</div><h2>${esc(q.question)}</h2>${q.options.map((o,i)=>`<div class="choice" style="${state.answers[state.index]===i?'border-color:#5b5cf0;background:#f2f3ff':''}" onclick="choose(${i})"><b>${'ABCD'[i]}.</b> ${esc(o)}</div>`).join('')}</div><div class="actions"><button class="btn ghost" ${state.index?'':'disabled'} onclick="prevQ()">Previous</button><button class="btn" onclick="nextQ()">${state.index===state.questions.length-1?'Submit':'Next'}</button></div></div>`;tick()}
function choose(i){state.answers[state.index]=i;renderQuestion()}
function prevQ(){if(state.index>0){state.index--;renderQuestion()}}
function nextQ(){if(state.index<state.questions.length-1){state.index++;renderQuestion()}else submitAssessment(false)}
function tick(){clearInterval(state.timer);const end=state.startedAt+state.assessment.time_limit_minutes*60000;const go=()=>{const left=Math.max(0,end-Date.now());const el=document.getElementById('timer');if(el)el.textContent=`${String(Math.floor(left/60000)).padStart(2,'0')}:${String(Math.floor(left/1000)%60).padStart(2,'0')}`;if(left<=0){clearInterval(state.timer);submitAssessment(true)}};go();state.timer=setInterval(go,1000)}
async function submitAssessment(auto){if(state.submitted)return;state.submitted=true;clearInterval(state.timer);let correct=0;state.questions.forEach((q,i)=>{if(state.answers[i]===q.answer)correct++});const pct=Math.round(correct/state.questions.length*100);const row={assessment_id:state.assessment.id,full_name:state.name,course:state.assessment.slug,score:correct,percentage:pct,question_count:state.questions.length,started_at:new Date(state.startedAt).toISOString(),completed_at:new Date().toISOString(),duration_seconds:Math.round((Date.now()-state.startedAt)/1000),auto_submitted:auto,question_ids:state.questions.map(q=>q.id),answers:state.answers};const {error}=await sb.from('assessment_responses').insert(row);if(error){state.submitted=false;return renderError('Submission failed: '+error.message)}document.getElementById('app').innerHTML=`<div class="candidate shell"><div class="card center"><div class="badge">COMPLETED</div><h1 class="title">Assessment complete</h1><div class="metric">${pct}%</div><h2>${pct>=state.assessment.benchmark_percentage?'Benchmark achieved':'Review recommended'}</h2><p class="muted">You answered ${correct} of ${state.questions.length} correctly. Benchmark: ${state.assessment.benchmark_percentage}%.</p><button class="btn" onclick="location.href=location.pathname">Return to assessments</button></div></div>`}
function boot(){const isAdmin=new URLSearchParams(location.search).get('admin')==='1';if(isAdmin)adminPage();else candidateHome()}
boot();
</script></body></html>
