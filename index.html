}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.shell{max-width:1180px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.brand{font-weight:800;font-size:20px}.muted{color:var(--muted)}.card{
background:rgba(255,255,255,.90);
border:1px solid rgba(255,255,255,.78);
border-radius:20px;
padding:22px;
box-shadow:0 16px 42px rgba(16,24,40,.10);
margin-bottom:18px;
backdrop-filter:blur(10px) saturate(1.04);
-webkit-backdrop-filter:blur(10px) saturate(1.04)
}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.metric{font-size:32px;font-weight:850;margin-top:5px}.btn{padding:11px 15px;border-radius:12px;background:var(--brand);color:#fff;font-weight:700}.btn.secondary{background:#eef0ff;color:#4144c8}.btn.ghost{background:rgba(255,255,255,.90);color:var(--text);border:1px solid var(--line)}.btn.danger{background:#fee4e2;color:#b42318}.actions{display:flex;gap:8px;flex-wrap:wrap}.field{margin:12px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px 13px;border:1px solid #d7dce5;border-radius:11px;background:#fff}.two{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.drop{border:2px dashed #cbd2e1;border-radius:16px;padding:25px;text-align:center;background:#fafbff}.status{padding:10px 12px;border-radius:10px;background:#f2f4f7;color:#344054}.status.good{background:#ecfdf3;color:#087443}.status.bad{background:#fef3f2;color:#b42318}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eef0ff;color:#4144c8;font-size:12px;font-weight:800}.assessment{display:flex;justify-content:space-between;gap:18px;align-items:center}.assessment h3{margin:0 0 6px}.stats{display:flex;gap:20px;flex-wrap:wrap;color:#475467;font-size:14px}.qrow{padding:14px 0;border-top:1px solid var(--line)}.qrow:first-child{border-top:0}.qtext{font-weight:700}.option{font-size:13px;color:#475467;margin-top:4px}.hidden{display:none!important}.center{text-align:center}.candidate{max-width:820px;margin:30px auto}.choice{border:1px solid var(--line);padding:16px;border-radius:14px;margin:10px 0;background:rgba(255,255,255,.94);transition:.18s ease}.choice:hover{border-color:#9da1ff;transform:translateY(-1px);box-shadow:0 8px 22px rgba(16,24,40,.06)}.timer{font-size:26px;font-weight:900}.progress{height:8px;background:#e9edf4;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;color:#667085;text-transform:uppercase}.notice{padding:12px;border-radius:12px;background:#fff7ed;color:#9a3412}.small{font-size:13px}.title{font-size:30px;margin:0 0 5px}@media(max-width:700px){.two,.three{grid-template-columns:1fr}.assessment{align-items:flex-start;flex-direction:column}.top{align-items:flex-start;flex-direction:column}}

body::before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
z-index:0;
background:
radial-gradient(circle at 20% 22%,rgba(255,255,255,.20),transparent 28%),
radial-gradient(circle at 82% 70%,rgba(255,244,230,.16),transparent 34%)
}
#app{position:relative;z-index:2}
.bg-sparkles{
position:fixed;
inset:0;
z-index:1;
pointer-events:none;
overflow:hidden
}
.bg-spark{
position:absolute;
width:3px;
height:3px;
border-radius:50%;
background:#fff;
opacity:.18;
box-shadow:0 0 7px rgba(255,255,255,.95),0 0 13px rgba(255,255,255,.65);
animation:bgTwinkle 3.6s ease-in-out infinite
}
.bg-spark.orange{
background:#ff7a00;
box-shadow:0 0 6px rgba(255,122,0,.55);
width:2.5px;
height:2.5px
}
@keyframes bgTwinkle{
0%,100%{opacity:.12;transform:scale(.7)}
50%{opacity:.9;transform:scale(1.2)}
}
@media(prefers-reduced-motion:reduce){
.bg-spark{animation:none!important}
}

/* ===== Course portal enhancements ===== */
.ticker-bar{position:relative;overflow:hidden;background:#4239A1;color:#fff;border-bottom:1px solid rgba(255,255,255,.14);box-shadow:0 8px 24px rgba(16,24,40,.15);min-height:48px;display:flex;align-items:center;width:100%}
.ticker-fixed{position:fixed;top:0;left:0;right:0;z-index:10000}
.ticker-spacer{width:100%;pointer-events:none}
.ticker-label{position:absolute;left:0;top:0;bottom:0;z-index:2;display:flex;align-items:center;justify-content:center;width:160px;padding:0 14px;background:rgba(0,0,0,.18);backdrop-filter:blur(2px)}
.ticker-logo-img{display:block;width:auto;height:32px;max-width:132px;object-fit:contain;mix-blend-mode:screen;filter:brightness(1.08) contrast(1.08);pointer-events:none;user-select:none}
.ticker-window{overflow:hidden;width:100%;padding-left:160px}
.ticker-track{display:inline-block;white-space:nowrap;min-width:max-content;padding-left:100%;font-weight:800;letter-spacing:.055em;text-transform:uppercase;animation:newsTicker 24s linear infinite;will-change:transform;line-height:1.1}
.ticker-bar:hover .ticker-track{animation-play-state:paused}
@keyframes newsTicker{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.ticker-style-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ticker-color-field{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:center}
.ticker-color-field input[type="color"]{padding:2px;height:44px}
.ticker-range-row{display:grid;grid-template-columns:1fr 64px;gap:10px;align-items:center}
.ticker-range-row input[type="range"]{padding:0;border:0;background:transparent}
.ticker-value{font-size:12px;font-weight:800;color:#475467;text-align:right}
.ticker-preview-shell{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:#f8fafc;margin:14px 0}
.portal-toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 18px}
.month-strip{display:grid;grid-template-columns:repeat(12,minmax(72px,1fr));gap:8px;margin:14px 0 18px}
.month-btn{padding:10px 8px;border-radius:12px;background:rgba(255,255,255,.9);border:1px solid var(--line);color:#475467;font-size:12px;font-weight:800;transition:.18s ease}
.month-btn:hover{transform:translateY(-1px);border-color:#b6b8ff}
.month-btn.active{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(91,92,240,.22)}
.folder-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:0 0 18px}
.folder-tile{min-height:86px;padding:14px;border-radius:16px;background:rgba(255,255,255,.9);border:1px solid var(--line);text-align:left;transition:.18s ease;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.folder-tile:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(16,24,40,.08);border-color:#b6b8ff}
.folder-tile.active{border-color:var(--brand);box-shadow:0 0 0 2px rgba(91,92,240,.12)}
.folder-title{font-weight:850;line-height:1.25;overflow-wrap:anywhere}
.folder-count{font-size:12px;color:var(--muted);font-weight:700}
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,274px);gap:16px;align-items:start;justify-content:start}
.course-card{width:274px;max-width:274px;height:394px;min-height:394px;max-height:394px;display:flex;flex-direction:column;gap:0;overflow:hidden}
.course-card .badge-row{min-height:28px;display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}
.course-title{font-size:20px;line-height:1.3;margin:12px 0 8px;min-height:52px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.course-desc{line-height:1.5;min-height:66px;margin:0 0 14px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.course-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:4px}
.course-stat{padding:9px 8px;border-radius:10px;background:#f7f8fc;text-align:center;min-width:0}
.course-stat b{display:block;font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.course-stat span{display:block;font-size:10px;color:var(--muted);font-weight:750;text-transform:uppercase;margin-top:2px}
.course-card .course-action{margin-top:auto;padding-top:18px}
.admin-subnav{display:flex;gap:8px;flex-wrap:wrap}
.folder-admin-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.folder-admin-row:first-child{border-top:0}
.sqlbox{width:100%;min-height:220px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;resize:vertical}
.meta-badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
.badge.neutral{background:#f2f4f7;color:#475467}
.badge.month{background:#ecfdf3;color:#087443}
.empty-state{padding:24px;text-align:center;border:1px dashed #cbd2e1;border-radius:16px;background:rgba(255,255,255,.7)}
@media(max-width:900px){.month-strip{grid-template-columns:repeat(6,1fr)}.ticker-style-grid{grid-template-columns:1fr}}
@media(max-width:560px){.month-strip{grid-template-columns:repeat(3,1fr)}.ticker-label{width:108px;padding:0 10px}.ticker-logo-img{height:26px;max-width:88px}.ticker-window{padding-left:108px}.course-grid{grid-template-columns:minmax(0,274px);justify-content:center}.course-card{width:100%;max-width:274px;height:394px;min-height:394px;max-height:394px}}
@media(prefers-reduced-motion:reduce){.ticker-track{animation:none;padding-left:16px;white-space:normal}}

function toast(msg,bad=false){const el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.className='status '+(bad?'bad':'good');el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),4500)}
function needSb(){if(!sb){toast('Add your Supabase publishable/anon key in index.html first.',true);return false}return true}
async function adminCheck(){if(!needSb())return null;const {data:{user},error}=await sb.auth.getUser();if(error||!user)return null;const {data:role,error:e}=await sb.from('staff_roles').select('role').eq('user_id',user.id).eq('role','admin').maybeSingle();if(e)throw e;if(!role)return null;return user}
function adminShell(body){return `<div class="shell"><div class="top"><div><div class="brand">AWS Assessment Manager</div><div class="muted small">Admin control center</div></div><div class="actions"><button class="btn ghost" onclick="location.href=location.pathname">Candidate</button><button class="btn ghost" onclick="signOut()">Sign out</button></div></div><div id="toast" class="status hidden"></div>${body}</div>`}
async function signOut(){await sb.auth.signOut();location.reload()}
async function adminPage(){if(!needSb())return renderLogin();let user;try{user=await adminCheck()}catch(e){return renderError('Admin verification failed: '+e.message)}if(!user)return renderLogin();state.adminUser=user;renderAdmin();}
function renderLogin(){document.getElementById('app').innerHTML=`<div class="shell"><div class="candidate"><div class="card"><div class="badge">ADMIN</div><h1 class="title">Administrator sign in</h1><p class="muted">Use the Supabase Auth account that has role <b>admin</b> in <code>staff_roles</code>.</p><div class="field"><label>Email</label><input id="aemail" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="apass" type="password" autocomplete="current-password"></div><button class="btn" onclick="loginAdmin()">Sign in</button><div id="loginmsg" class="status hidden" style="margin-top:12px"></div></div></div></div>`}
async function loginAdmin(){const msg=document.getElementById('loginmsg');msg.classList.remove('hidden');msg.textContent='Signing in…';const {error}=await sb.auth.signInWithPassword({email:document.getElementById('aemail').value.trim(),password:document.getElementById('apass').value});if(error){msg.className='status bad';msg.textContent=error.message;return}location.reload()}
async function getAssessments(){const {data,error}=await sb.from('assessments').select('*').order('created_at',{ascending:false});if(error)throw error;return data||[]}
async function getCounts(ids){if(!ids.length)return {};const {data,error}=await sb.from('assessment_responses').select('assessment_id,percentage').in('assessment_id',ids);if(error)throw error;const out={};(data||[]).forEach(r=>{out[r.assessment_id]??={count:0,total:0};out[r.assessment_id].count++;out[r.assessment_id].total+=Number(r.percentage||0)});return out}

let parsedQuestions=[];

function normalizeImportedText(text){
  return String(text??'')
    .replace(/^\uFEFF/,'')
    .replace(/\r\n?/g,'\n')
    .replace(/\u00A0/g,' ')
    .replace(/[\u200B-\u200D\u2060\uFEFF]/g,'')
    .replace(/[ \t]+/g,' ')
    .replace(/[ \t]*\n[ \t]*/g,'\n')
    .replace(/\n{3,}/g,'\n\n')
    .trim();
}

function getFileExtension(name){
  const clean=String(name||'').toLowerCase().split('?')[0].split('#')[0];
  const i=clean.lastIndexOf('.');
  return i>=0?clean.slice(i+1):'';
}

async function readTextFile(file){
  const buf=await file.arrayBuffer();
  const bytes=new Uint8Array(buf);

  if(bytes.length>=3&&bytes[0]===0xEF&&bytes[1]===0xBB&&bytes[2]===0xBF){
    return new TextDecoder('utf-8').decode(bytes.subarray(3));
  }
  if(bytes.length>=2&&bytes[0]===0xFF&&bytes[1]===0xFE){
    return new TextDecoder('utf-16le').decode(bytes.subarray(2));
  }
  if(bytes.length>=2&&bytes[0]===0xFE&&bytes[1]===0xFF){
    const swapped=new Uint8Array(bytes.length-2);
    for(let i=2,j=0;i+1<bytes.length;i+=2,j+=2){
      swapped[j]=bytes[i+1];
      swapped[j+1]=bytes[i];
    }
    return new TextDecoder('utf-16le').decode(swapped);
  }

  try{
    return new TextDecoder('utf-8',{fatal:true}).decode(bytes);
  }catch(_){
    return new TextDecoder('windows-1252').decode(bytes);
  }
}

function htmlToAssessmentText(raw){
  const doc=new DOMParser().parseFromString(raw,'text/html');
  doc.querySelectorAll('script,style,noscript,svg,canvas,iframe,template').forEach(x=>x.remove());

  doc.querySelectorAll('br').forEach(el=>el.replaceWith('\n'));
  doc.querySelectorAll('p,div,section,article,header,footer,main,aside,h1,h2,h3,h4,h5,h6,li,tr,dt,dd,blockquote,pre')
    .forEach(el=>el.appendChild(doc.createTextNode('\n')));

  return normalizeImportedText(doc.body?.textContent||doc.documentElement?.textContent||'');
}

function markdownToAssessmentText(raw){
  let t=normalizeImportedText(raw);

  t=t.replace(/^\s*```[^\n]*$/gm,'');
  t=t
    .replace(/^\s{0,3}#{1,6}\s+/gm,'')
    .replace(/^\s*>\s?/gm,'')
    .replace(/^\s*[-*+]\s+(?=(?:Question\s+\d+|\d+\s*[\.\)]|[A-D]\s*[\.\):\-]|(?:Correct\s+)?Answer\s*:))/gmi,'')
    .replace(/\*\*([^*\n]+)\*\*/g,'$1')
    .replace(/__([^_\n]+)__/g,'$1')
    .replace(/\[([^\]]+)\]\([^)]+\)/g,'$1')
    .replace(/^\s*(?:---+|\*\*\*+|___+)\s*$/gm,'');

  return normalizeImportedText(t);
}

function pdfTextToLines(items){
  const rows=[];
  for(const item of items){
    const str=String(item.str||'').trim();
    if(!str)continue;
    const y=item.transform?.[5]??0;
    let row=rows.find(r=>Math.abs(r.y-y)<2);
    if(!row){row={y,parts:[]};rows.push(row)}
    row.parts.push({x:item.transform?.[4]??0,str});
  }
  rows.sort((a,b)=>b.y-a.y);
  return rows.map(r=>r.parts.sort((a,b)=>a.x-b.x).map(p=>p.str).join(' ')).join('\n');
}

async function extractQuestionBankText(file){
  const ext=getFileExtension(file.name);

  if(ext==='docx'){
    if(!window.mammoth)throw new Error('DOCX reader library is not available.');
    const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});
    return normalizeImportedText(r.value);
  }

  if(ext==='pdf'){
    if(!window.pdfjsLib)throw new Error('PDF reader library is not available.');
    const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    let out='';
    for(let p=1;p<=pdf.numPages;p++){
      const page=await pdf.getPage(p);
      const tc=await page.getTextContent();
      out+='\n'+pdfTextToLines(tc.items);
    }
    return normalizeImportedText(out);
  }

  if(['md','markdown','html','htm','txt'].includes(ext)){
    const raw=await readTextFile(file);
    if(!raw.trim())throw new Error('The selected file is empty or contains no readable text.');
    if(ext==='html'||ext==='htm')return htmlToAssessmentText(raw);
    if(ext==='md'||ext==='markdown')return markdownToAssessmentText(raw);
    return normalizeImportedText(raw);
  }

  throw new Error('Unsupported file type. Use .docx, .pdf, .md, .html/.htm, or .txt.');
}

async function parseUpload(file){
  if(!file)return;
  const st=document.getElementById('parseStatus');
  st.className='status';
  st.textContent='Reading and validating question bank…';
  st.classList.remove('hidden');
  parsedQuestions=[];

  try{
    const text=await extractQuestionBankText(file);
    parsedQuestions=parseQuestions(text);

    const diagnostics=validateParsedQuestions(parsedQuestions);
    if(!parsedQuestions.length){
      throw new Error('No valid questions detected. Expected four options A-D and an Answer: A/B/C/D line for each question.');
    }
    if(diagnostics.length){
      throw new Error('Question validation failed: '+diagnostics.slice(0,5).join(' | '));
    }

    st.className='status good';
    st.textContent=`✓ ${parsedQuestions.length} questions detected and validated from ${file.name}`;

    const nameEl=document.getElementById('aname');
    if(parsedQuestions.length&&!nameEl.value){
      nameEl.value=file.name.replace(/\.(docx|pdf|md|markdown|html|htm|txt)$/i,'');
    }
  }catch(e){
    parsedQuestions=[];
    st.className='status bad';
    st.textContent='Could not import file: '+e.message;
  }
}

function parseQuestions(rawText){
  let text=normalizeImportedText(rawText);

  text=text
    .replace(/\s+(?=(?:Question\s+\d+\b))/gi,'\n')
    .replace(/\s+(?=[A-D]\s*[\.\):\-]\s+)/g,'\n')
    .replace(/\s+(?=(?:Correct\s+)?Answer\s*[:\-]\s*[A-D]\b)/gi,'\n');

  const lines=text.split('\n').map(x=>x.trim()).filter(Boolean);
  const out=[];
  let current=null;
  let activeOption=null;

  const save=()=>{
    if(!current)return;
    current.question=current.question.trim();
    current.options=current.options.map(x=>x.trim());

    if(
      current.question &&
      current.options.length===4 &&
      current.options.every(Boolean) &&
      Number.isInteger(current.answer) &&
      current.answer>=0 &&
      current.answer<=3
    ){
      out.push({
        question:current.question,
        options:current.options,
        answer:current.answer
      });
    }
    current=null;
    activeOption=null;
  };

  for(const line of lines){
    const qm=line.match(/^(?:Question\s*)?(\d+)\s*(?:[\.\):\-]\s*)?(.*)$/i);

    if(qm){
      const explicit=/^Question\s*/i.test(line);
      const delimited=new RegExp('^\\s*'+qm[1]+'\\s*[\\.\\)]\\s+').test(line);
      if(explicit||delimited){
        save();
        current={
          sourceNumber:Number(qm[1]),
          question:(qm[2]||'').trim(),
          options:['','','',''],
          answer:null
        };
        continue;
      }
    }

    if(!current)continue;

    const om=line.match(/^([A-D])\s*[\.\):\-]\s*(.+)$/i);
    if(om){
      activeOption='ABCD'.indexOf(om[1].toUpperCase());
      current.options[activeOption]=om[2].trim();
      continue;
    }

    const am=line.match(/^(?:Correct\s+)?Answer\s*[:\-]\s*([A-D])(?:\b|$)/i);
    if(am){
      current.answer='ABCD'.indexOf(am[1].toUpperCase());
      activeOption=null;
      continue;
    }

    if(activeOption!==null){
      current.options[activeOption]=(current.options[activeOption]+' '+line).trim();
    }else if(!current.options.some(Boolean)&&current.answer===null){
      current.question=(current.question+' '+line).trim();
    }
  }

  save();

  const seen=new Set();
  return out.filter(q=>{
    const key=(q.question+'\u0000'+q.options.join('\u0000')+'\u0000'+q.answer).toLowerCase();
    if(seen.has(key))return false;
    seen.add(key);
    return true;
  });
}

function validateParsedQuestions(questions){
  const issues=[];
  questions.forEach((q,i)=>{
    if(!q.question?.trim())issues.push(`Question ${i+1}: missing question text`);
    if(!Array.isArray(q.options)||q.options.length!==4||q.options.some(x=>!String(x||'').trim())){
      issues.push(`Question ${i+1}: must contain exactly four non-empty options`);
    }
    if(!Number.isInteger(q.answer)||q.answer<0||q.answer>3){
      issues.push(`Question ${i+1}: invalid answer`);
    }
  });
  return issues;
}
function previewParsed(){const p=document.getElementById('preview');if(!parsedQuestions.length){p.classList.remove('hidden');p.innerHTML='<div class="notice">Upload a valid question bank first.</div>';return}p.classList.remove('hidden');p.innerHTML=`<h3>Preview (${parsedQuestions.length})</h3>`+parsedQuestions.slice(0,5).map((q,i)=>`<div class="qrow"><div class="qtext">${i+1}. ${esc(q.question)}</div>${q.options.map((o,j)=>`<div class="option">${'ABCD'[j]}. ${esc(o)}</div>`).join('')}<div class="small muted">Answer: ${'ABCD'[q.answer]}</div></div>`).join('')+(parsedQuestions.length>5?`<div class="muted small">Showing first 5. All ${parsedQuestions.length} will be imported.</div>`:'')}
async function publishNew(){if(!parsedQuestions.length)return toast('Upload a valid question bank first.',true);const name=document.getElementById('aname').value.trim();if(!name)return toast('Enter a course title.',true);const qpa=Number(document.getElementById('qpa').value),mins=Number(document.getElementById('mins').value),bench=Number(document.getElementById('bench').value);if(qpa<1||qpa>parsedQuestions.length||mins<1||bench<0||bench>100)return toast('Check the course settings.',true);const s=slug(document.getElementById('aslug').value.trim()||name);try{const {data:a,error}=await sb.from('assessments').insert({slug:s,name,description:document.getElementById('adesc').value.trim(),question_count:parsedQuestions.length,questions_per_attempt:qpa,time_limit_minutes:mins,benchmark_percentage:bench,shuffle_questions:document.getElementById('shuffleQ').checked,shuffle_options:document.getElementById('shuffleO').checked,published:true}).select().single();if(error)throw error;const rows=parsedQuestions.map((q,i)=>({assessment_id:a.id,question_number:i+1,question:q.question,option_a:q.options[0],option_b:q.options[1],option_c:q.options[2],option_d:q.options[3],correct_answer:q.answer,difficulty:'intermediate'}));for(let i=0;i<rows.length;i+=100){const {error:e}=await sb.from('assessment_questions').insert(rows.slice(i,i+100));if(e)throw e}await loadPortalSettings();state.portalSettings.courseMeta[a.id]={folderId:document.getElementById('afolder').value||'',month:Number(document.getElementById('amonth').value||0)};const saved=await savePortalSettings();renderAdmin();setTimeout(()=>toast(saved.backend?'Course published.':'Course published. Folder/month settings are browser-only until backend setup is completed.',!saved.backend),0)}catch(e){toast(e.message,true)}}

async function removeAssessment(id,name){
  if(!needSb())return;

  const label=name||'this assessment';
  const ok=confirm(
    `Remove "${label}"?\n\nThis will permanently delete the assessment, its questions, and all recorded responses. This action cannot be undone.`
  );
  if(!ok)return;

  try{
    // Delete child records first so this also works when database foreign keys
    // are not configured with ON DELETE CASCADE.
    let r=await sb.from('assessment_responses').delete().eq('assessment_id',id);
    if(r.error)throw r.error;

    r=await sb.from('assessment_questions').delete().eq('assessment_id',id);
    if(r.error)throw r.error;

    r=await sb.from('assessments').delete().eq('id',id);
    if(r.error)throw r.error;

    await loadPortalSettings();
    if(state.portalSettings?.courseMeta?.[id]){
      delete state.portalSettings.courseMeta[id];
      await savePortalSettings();
    }
    await loadAdminData();
    setTimeout(()=>toast(`Removed "${label}".`),50);
  }catch(e){
    toast('Could not remove assessment: '+e.message,true);
  }
}

renderAdmin()">Back</button><button class="btn" onclick="saveAssessment('${id}')">Save course</button></div></div>`)}
async function saveAssessment(id){const name=document.getElementById('ename').value.trim();if(!name)return toast('Enter a course title.',true);const patch={name,description:document.getElementById('edesc').value.trim(),questions_per_attempt:Number(document.getElementById('eqpa').value),time_limit_minutes:Number(document.getElementById('emins').value),benchmark_percentage:Number(document.getElementById('ebench').value),shuffle_questions:document.getElementById('eshq').checked,shuffle_options:document.getElementById('esho').checked,published:document.getElementById('epub').checked,updated_at:new Date().toISOString()};const {error}=await sb.from('assessments').update(patch).eq('id',id);if(error)return toast(error.message,true);await loadPortalSettings();state.portalSettings.courseMeta[id]={folderId:document.getElementById('efolder').value||'',month:Number(document.getElementById('emonth').value||0)};const saved=await savePortalSettings();renderAdmin();setTimeout(()=>toast(saved.backend?'Course settings saved.':'Course saved. Folder/month settings are browser-only until backend setup is completed.',!saved.backend),0)}
async function viewResponses(id){const {data:a}=await sb.from('assessments').select('name').eq('id',id).single();const {data:r,error}=await sb.from('assessment_responses').select('*').eq('assessment_id',id).order('completed_at',{ascending:false});if(error)return toast(error.message,true);document.getElementById('app').innerHTML=adminShell(`<div class="card"><div class="top"><div><div class="badge">RESPONSES</div><h1 class="title">${esc(a?.name||'Assessment')}</h1><div class="muted"><b>${r.length}</b> responses</div></div><div class="actions"><button class="btn secondary" onclick="downloadExcel('${id}')">Download Excel</button><button class="btn secondary" onclick="downloadWord('${id}')">Download Questions (Word)</button><button class="btn ghost" onclick="renderAdmin()">Back</button></div></div><div class="tablewrap"><table><thead><tr><th>Candidate</th><th>Score</th><th>%</th><th>Duration</th><th>Completed</th><th>Auto</th></tr></thead><tbody>${r.map(x=>`<tr><td>${esc(x.full_name)}</td><td>${x.score}/${x.question_count}</td><td>${x.percentage}%</td><td>${Math.floor(x.duration_seconds/60)}m ${x.duration_seconds%60}s</td><td>${new Date(x.completed_at).toLocaleString()}</td><td>${x.auto_submitted?'Yes':'No'}</td></tr>`).join('')}</tbody></table></div></div>`)}
async function downloadExcel(id){const {data:a}=await sb.from('assessments').select('name').eq('id',id).single();const {data:r,error}=await sb.from('assessment_responses').select('full_name,score,percentage,question_count,started_at,completed_at,duration_seconds,auto_submitted').eq('assessment_id',id).order('completed_at',{ascending:false});if(error)return toast(error.message,true);if(!r.length)return toast('No responses for this assessment yet.',true);const rows=r.map(x=>({'Candidate':x.full_name,'Score':`${x.score}/${x.question_count}`,'Percentage':x.percentage,'Started':x.started_at,'Completed':x.completed_at,'Duration (seconds)':x.duration_seconds,'Auto submitted':x.auto_submitted?'Yes':'No'}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Responses');XLSX.writeFile(wb,`${slug(a?.name||'assessment')}-responses.xlsx`)}

function wordXmlEsc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}
function wordRun(text,bold=false,size=22){return `<w:r><w:rPr>${bold?'<w:b/>':''}<w:sz w:val="${size}"/><w:szCs w:val="${size}"/></w:rPr><w:t xml:space="preserve">${wordXmlEsc(text)}</w:t></w:r>`}
function wordParagraph(text,{bold=false,size=22,spaceAfter=120,center=false}={}){return `<w:p><w:pPr>${center?'<w:jc w:val="center"/>':''}<w:spacing w:after="${spaceAfter}"/></w:pPr>${wordRun(text,bold,size)}</w:p>`}
async function downloadWord(id){
  if(typeof JSZip==='undefined')return toast('Word export library did not load. Refresh the page and try again.',true);
  try{
    const [{data:a,error:ae},{data:qs,error:qe}]=await Promise.all([
      sb.from('assessments').select('name,description,question_count,questions_per_attempt,time_limit_minutes,benchmark_percentage').eq('id',id).single(),
      sb.from('assessment_questions').select('question_number,question,option_a,option_b,option_c,option_d,correct_answer').eq('assessment_id',id).order('question_number')
    ]);
    if(ae)throw ae;
    if(qe)throw qe;
    if(!qs||!qs.length)return toast('No questions found for this assessment.',true);
    let body='';
    body+=wordParagraph(a?.name||'Assessment Questions',{bold:true,size:34,spaceAfter:100,center:true});
    body+=wordParagraph('Assessment Question Bank',{bold:true,size:24,spaceAfter:240,center:true});
    if(a?.description)body+=wordParagraph(a.description,{size:20,spaceAfter:180});
    body+=wordParagraph(`Total Questions: ${qs.length}`,{bold:true,size:20,spaceAfter:60});
    body+=wordParagraph(`Questions per Attempt: ${a?.questions_per_attempt??''}`,{size:20,spaceAfter:60});
    body+=wordParagraph(`Time Limit: ${a?.time_limit_minutes??''} minutes`,{size:20,spaceAfter:60});
    body+=wordParagraph(`Benchmark: ${a?.benchmark_percentage??''}%`,{size:20,spaceAfter:260});
    qs.forEach((q,i)=>{
      const n=q.question_number??(i+1);
      const opts=[q.option_a,q.option_b,q.option_c,q.option_d];
      const ans=Number(q.correct_answer);
      body+=wordParagraph(`Question ${n}`,{bold:true,size:23,spaceAfter:80});
      body+=wordParagraph(q.question,{size:22,spaceAfter:100});
      opts.forEach((o,j)=>{body+=wordParagraph(`${'ABCD'[j]}. ${o??''}`,{size:21,spaceAfter:45})});
      body+=wordParagraph(`Correct Answer: ${Number.isInteger(ans)&&ans>=0&&ans<4?'ABCD'[ans]:'-'}`,{bold:true,size:21,spaceAfter:240});
    });
    const documentXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`;
    const contentTypes=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`;
    const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
    const zip=new JSZip();
    zip.file('[Content_Types].xml',contentTypes);
    zip.folder('_rels').file('.rels',rels);
    zip.folder('word').file('document.xml',documentXml);
    const blob=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');
    link.href=url;
    link.download=`${slug(a?.name||'assessment')}-questions.docx`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast(`Downloaded ${qs.length} questions in Word format.`);
  }catch(e){toast('Word export failed: '+e.message,true)}
}

function renderError(m){document.getElementById('app').innerHTML=`<div class="shell"><div class="card"><div class="status bad">${esc(m)}</div></div></div>`}
async function candidateHome(){if(!needSb())return renderError('Add your Supabase publishable/anon key in index.html.');const [{data,error},settings]=await Promise.all([sb.from('assessments').select('*').eq('published',true).order('name'),loadPortalSettings(true)]);if(error)return renderError(error.message);state.catalogAssessments=data||[];if(!state.catalogMonth)state.catalogMonth=new Date().getMonth()+1;if(!state.catalogFolder)state.catalogFolder='all';renderCandidateCatalog()}
function setCatalogMonth(month){state.catalogMonth=Number(month);state.catalogFolder='all';renderCandidateCatalog()}
function showAllCourses(){state.catalogMonth=0;state.catalogFolder='all';renderCandidateCatalog()}
function setCatalogFolder(folder){state.catalogFolder=String(folder);renderCandidateCatalog()}
function renderCandidateCatalog(){const settings=state.portalSettings||cloneDefaultSettings(),selectedMonth=state.catalogMonth===null?new Date().getMonth()+1:Number(state.catalogMonth),all=state.catalogAssessments||[],showingAll=selectedMonth===0;const monthCourses=showingAll?all:all.filter(a=>courseMeta(a.id).month===selectedMonth);const folders=settings.folders||[];const countFor=id=>monthCourses.filter(a=>courseMeta(a.id).folderId===id).length;let visible=monthCourses;if(state.catalogFolder!=='all')visible=monthCourses.filter(a=>courseMeta(a.id).folderId===state.catalogFolder);const folderTiles=[`<button class="folder-tile ${showingAll&&state.catalogFolder==='all'?'active':''}" onclick="showAllCourses()"><span class="folder-title">All Courses</span><span class="folder-count">${all.length} available</span></button>`,...folders.map(f=>`<button class="folder-tile ${state.catalogFolder===String(f.id)?'active':''}" onclick="setCatalogFolder('${esc(f.id)}')"><span class="folder-title">${esc(f.name)}</span><span class="folder-count">${countFor(String(f.id))} available</span></button>`)].join('');const cards=visible.length?visible.map(a=>{const meta=courseMeta(a.id),folder=folderName(meta.folderId);return `<div class="card course-card"><div class="badge-row"><span class="badge">COURSE</span>${folder?`<span class="badge neutral">${esc(folder)}</span>`:''}${meta.month?`<span class="badge month">${esc(monthLabel(meta.month))}</span>`:''}</div><h2 class="course-title" title="${esc(a.name)}">${esc(a.name)}</h2><p class="muted course-desc">${esc(a.description||'Course assessment and knowledge check.')}</p><div class="course-stats"><div class="course-stat"><b>${a.questions_per_attempt}</b><span>Questions</span></div><div class="course-stat"><b>${a.time_limit_minutes}</b><span>Minutes</span></div><div class="course-stat"><b>${a.benchmark_percentage}%</b><span>Benchmark</span></div></div><div class="course-action"><button class="btn" style="width:100%" onclick="startAssessment('${a.id}')">Open Assessment</button></div></div>`}).join(''):`<div class="empty-state"><h3 style="margin-top:0">No courses available</h3><div class="muted">${showingAll?'There are no published courses available.':`There are no published courses for ${esc(MONTHS[selectedMonth-1])} in this folder. Try another month or folder.`}</div></div>`;const periodLabel=showingAll?'ALL COURSES':MONTHS[selectedMonth-1];document.getElementById('app').innerHTML=`${tickerMarkup(settings,true)}<div class="shell"><div class="top"><div><div class="brand">Developer Learning Management System Portal</div><div class="muted">Browse courses by month and folder</div></div><button class="btn ghost" onclick="location.search='?admin=1'">Admin</button></div><div class="card"><div class="portal-toolbar"><div><div class="badge month">${esc(periodLabel)}</div><h1 class="title" style="font-size:26px;margin-top:8px">Available Course Assessments</h1><div class="muted small">${showingAll?'Showing every published course. Select a month to return to month-only viewing.':`Showing only courses published for ${esc(MONTHS[selectedMonth-1])}. Select All Courses to show every published course.`}</div></div></div><div class="month-strip">${MONTHS.map((m,i)=>`<button class="month-btn ${selectedMonth===i+1?'active':''}" onclick="setCatalogMonth(${i+1})">${m.slice(0,3)}</button>`).join('')}</div><div class="folder-grid">${folderTiles}</div></div><div class="course-grid">${cards}</div></div>`}
async function startAssessment(id){const {data:a,error}=await sb.from('assessments').select('*').eq('id',id).eq('published',true).single();if(error)return toast(error.message,true);const {data:qs,error:e}=await sb.from('assessment_questions').select('*').eq('assessment_id',id).order('question_number');if(e)return toast(e.message,true);if(!qs||qs.length<a.questions_per_attempt)return toast('This assessment does not have enough questions.',true);state.assessment=a;state.questions=[...qs];if(a.shuffle_questions)state.questions.sort(()=>Math.random()-.5);state.questions=state.questions.slice(0,a.questions_per_attempt);state.questions=state.questions.map(q=>{let opts=[q.option_a,q.option_b,q.option_c,q.option_d],answer=q.correct_answer;if(a.shuffle_options){const pairs=opts.map((o,i)=>({o,i})).sort(()=>Math.random()-.5);answer=pairs.findIndex(x=>x.i===answer);opts=pairs.map(x=>x.o)}return {...q,options:opts,answer}});state.answers=[];state.index=0;state.name='';state.startedAt=null;state.submitted=false;renderStart()}
function renderStart(){const a=state.assessment;document.getElementById('app').innerHTML=`<div class="candidate shell"><div class="card"><div class="badge">ASSESSMENT</div><h1 class="title">${esc(a.name)}</h1><p class="muted">${esc(a.description||'')}</p><div class="stats"><span>${a.questions_per_attempt} questions</span><span>•</span><span>${a.time_limit_minutes} minutes</span><span>•</span><span>${a.benchmark_percentage}% Benchmark</span></div><div class="field"><label>Full name</label><input id="candidateName" placeholder="Enter your full name"></div><button class="btn" onclick="beginAssessment()">Begin assessment</button></div></div>`}
function beginAssessment(){const n=document.getElementById('candidateName').value.trim();if(!n)return toast('Enter your full name.',true);state.name=n;state.startedAt=Date.now();renderQuestion();}
function renderQuestion(){const a=state.assessment,q=state.questions[state.index],answered=state.answers.filter(x=>x!==undefined).length;const pct=(state.index+1)/state.questions.length*100;document.getElementById('app').innerHTML=`<div class="shell candidate"><div class="top"><div><div class="brand">${esc(a.name)}</div><div class="muted">${answered}/${a.questions_per_attempt} answered</div></div><div id="timer" class="timer"></div></div><div class="progress"><div style="width:${pct}%"></div></div><div class="card"><div class="muted">Question ${state.index+1} of ${state.questions.length}</div><h2>${esc(q.question)}</h2>${q.options.map((o,i)=>`<div class="choice" style="${state.answers[state.index]===i?'border-color:#5b5cf0;background:#f2f3ff':''}" onclick="choose(${i})"><b>${'ABCD'[i]}.</b> ${esc(o)}</div>`).join('')}</div><div class="actions"><button class="btn ghost" ${state.index?'':'disabled'} onclick="prevQ()">Previous</button><button class="btn" onclick="nextQ()">${state.index===state.questions.length-1?'Submit':'Next'}</button></div></div>`;tick()}
function choose(i){state.answers[state.index]=i;renderQuestion()}
function prevQ(){if(state.index>0){state.index--;renderQuestion()}}
function nextQ(){if(state.index<state.questions.length-1){state.index++;renderQuestion()}else submitAssessment(false)}
function tick(){clearInterval(state.timer);const end=state.startedAt+state.assessment.time_limit_minutes*60000;const go=()=>{const left=Math.max(0,end-Date.now());const el=document.getElementById('timer');if(el)el.textContent=`${String(Math.floor(left/60000)).padStart(2,'0')}:${String(Math.floor(left/1000)%60).padStart(2,'0')}`;if(left<=0){clearInterval(state.timer);submitAssessment(true)}};go();state.timer=setInterval(go,1000)}
async function submitAssessment(auto){if(state.submitted)return;state.submitted=true;clearInterval(state.timer);let correct=0;state.questions.forEach((q,i)=>{if(state.answers[i]===q.answer)correct++});const pct=Math.round(correct/state.questions.length*100);const row={assessment_id:state.assessment.id,full_name:state.name,course:state.assessment.slug,score:correct,percentage:pct,question_count:state.questions.length,started_at:new Date(state.startedAt).toISOString(),completed_at:new Date().toISOString(),duration_seconds:Math.round((Date.now()-state.startedAt)/1000),auto_submitted:auto,question_ids:state.questions.map(q=>q.id),answers:state.answers};const {error}=await sb.from('assessment_responses').insert(row);if(error){state.submitted=false;return renderError('Submission failed: '+error.message)}document.getElementById('app').innerHTML=`<div class="candidate shell"><div class="card center"><div class="badge">COMPLETED</div><h1 class="title">Assessment complete</h1><div class="metric">${pct}%</div><h2>${pct>=state.assessment.benchmark_percentage?'Benchmark achieved':'Review recommended'}</h2><p class="muted">You answered ${correct} of ${state.questions.length} correctly. Benchmark: ${state.assessment.benchmark_percentage}%.</p><button class="btn" onclick="location.href=location.pathname">Return to assessments</button></div></div>`}

function initBackgroundSparkles(){
  const layer=document.getElementById('bgSparkles');
  if(!layer)return;
  const reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
  const whiteCount=reduced?8:18;
  const orangeCount=reduced?5:9;

  function addSpark(orange=false){
    const s=document.createElement('span');
    s.className='bg-spark'+(orange?' orange':'');
    s.style.left=(2+Math.random()*96)+'%';
    s.style.top=(2+Math.random()*96)+'%';
    s.style.animationDelay=(Math.random()*4)+'s';
    s.style.animationDuration=(3+Math.random()*3)+'s';
    layer.appendChild(s);
  }

  for(let i=0;i<whiteCount;i++)addSpark(false);
  for(let i=0;i<orangeCount;i++)addSpark(true);
}

function boot(){const isAdmin=new URLSearchParams(location.search).get('admin')==='1';if(isAdmin)adminPage();else candidateHome()}
initBackgroundSparkles();
boot();
</script></body></html>
