const COURSE_INFO = {
fundamentals:{title:"Amazon Connect Fundamentals",subtitle:"Developer assessment • foundational + intermediate",short:""},
ai:{title:"Amazon Connect AI Fundamentals",subtitle:"Developer assessment • foundational + intermediate",short:""}
};

let state={course:null,name:"",questions:[],index:0,answers:{},startedAt:null,deadline:null,timer:null,submitted:false};

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function route(){
 const p=new URLSearchParams(location.search);
 if(p.get("admin")==="1") return renderAdmin();
 const c=p.get("course");
 if(c==="fundamentals"||c==="ai") return renderStart(c);
 renderHome();
}
function renderHome(){
 document.getElementById("app").innerHTML=`<div class="wrap">
 <div class="brand"><div class="mark">A</div>AWS Connect Developer Assessment</div>
 <section class="hero"><div class="eyebrow">Modernizing Applications with AWS Developer Tools</div>
 <h1>Measure what you can build with AWS.</h1>
 </section>
 <div class="grid">${Object.entries(COURSE_INFO).map(([k,c])=>`<article class="card"><div class="eyebrow">${k==="fundamentals"?"COURSE 01":"COURSE 02"}</div><h2>${c.title}</h2><p>${c.subtitle}</p><div class="meta"><span class="pill">50 Questions</span><span class="pill">60 minutes</span><span class="pill">Passing Score 80%</span></div><a href="?course=${k}"><button>Begin assessment</button></a></article>`).join("")}</div>
 <p class="small" style="margin-top:24px">Content is independently authored from AWS documentation and training material, it is not an AWS certification exam.</p>
 </div>`;
}
function renderStart(course){
 state={course,name:"",questions:[],index:0,answers:{},startedAt:null,deadline:null,timer:null,submitted:false};
 const c=COURSE_INFO[course];
 document.getElementById("app").innerHTML=`<div class="wrap"><div class="brand"><div class="mark">A</div>AWS Connect Developer Assessment</div>
 <section class="hero"><div class="eyebrow">${esc(c.short)}</div><h1>${esc(c.title)}</h1><p>50 questions • 60 minutes • Passing Score 80%</p></section>
 <div class="card" style="max-width:650px"><h2>Before you begin</h2><p class="small">Please enter your full name. Your assessment record and score will be securely saved for our records.</p>
 <label class="small">Full name</label><input id="name" autocomplete="name" placeholder="Enter your full name">
 <div style="display:flex;gap:10px;margin-top:16px"><button id="startBtn">Start assessment</button><a href="./"><button class="ghost" type="button">Back</button></a></div></div></div>`;
 document.getElementById("startBtn").onclick=()=>start(course);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(course){
 const name=document.getElementById("name").value.trim();
 if(!name){document.getElementById("name").focus();return}
 state.name=name;state.course=course;
 state.questions=shuffle([...BANKS[course]]).slice(0,50).map(q=>{
   const copy={...q,options:[...q.options]}; const correct=copy.options[copy.answer]; shuffle(copy.options); copy.answer=copy.options.indexOf(correct); return copy;
 });
 state.startedAt=Date.now();state.deadline=state.startedAt+60*60*1000;
 renderQuestion();state.timer=setInterval(tick,250);
}
function tick(){
 const left=Math.max(0,state.deadline-Date.now());
 const el=document.getElementById("timer"); if(!el)return;
 const sec=Math.ceil(left/1000),m=Math.floor(sec/60),s=sec%60;
 el.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
 el.className="timer"+(sec<=300?" danger":sec<=900?" warn":"");
 if(left<=0) submit(true);
}
function renderQuestion(){
 const q=state.questions[state.index], answered=Object.keys(state.answers).length;
 document.getElementById("app").innerHTML=`<div class="topbar"><div class="topbarin"><div><strong>${esc(COURSE_INFO[state.course].short)}</strong><div class="small">${answered}/50 answered</div></div><div id="timer" class="timer">60:00</div></div><div class="progress"><div style="width:${((state.index+1)/50)*100}%"></div></div></div>
 <div class="wrap"><div class="summary"><span>Question ${state.index+1} of 50</span><span>Benchmark 80%</span></div>
 <section class="question"><div class="qnum">QUESTION ${String(state.index+1).padStart(2,"0")}</div><div class="qtext">${esc(q.question)}</div>
 <div class="options">${q.options.map((o,i)=>`<div class="opt ${state.answers[state.index]===i?"selected":""}" data-i="${i}"><span class="letter">${"ABCD"[i]}</span><span>${esc(o)}</span></div>`).join("")}</div></section>
 <div class="nav"><button class="ghost" id="prev" ${state.index===0?"disabled":""}>Previous</button><button id="next">${state.index===49?"Finish assessment":"Next question"}</button></div>
 </div>`;
 document.querySelectorAll(".opt").forEach(el=>el.onclick=()=>{state.answers[state.index]=Number(el.dataset.i);renderQuestion();});
 document.getElementById("prev").onclick=()=>{if(state.index>0){state.index--;renderQuestion()}};
 document.getElementById("next").onclick=()=>{if(state.index<49){state.index++;renderQuestion()}else submit(false)};
 tick();
}
async function submit(auto){
 if(state.submitted)return;state.submitted=true;clearInterval(state.timer);
 let correct=0;
 state.questions.forEach((q,i)=>{if(state.answers[i]===q.answer)correct++});
 const pct=Math.round(correct/50*100);
 const row={full_name:state.name,course:state.course,score:correct,percentage:pct,question_count:50,started_at:new Date(state.startedAt).toISOString(),completed_at:new Date().toISOString(),duration_seconds:Math.min(3600,Math.round((Date.now()-state.startedAt)/1000)),auto_submitted:auto,question_ids:state.questions.map(q=>q.id),answers:state.answers};
 if(sb){try{await sb.from("assessment_responses").insert(row)}catch(e){console.error(e)}}
 else {const k="aws_connect_demo_responses";const arr=JSON.parse(localStorage.getItem(k)||"[]");arr.push(row);localStorage.setItem(k,JSON.stringify(arr))}
 renderResult(correct,pct,auto);
}
function renderResult(correct,pct,auto){
 const tone=pct>=80?"Benchmark achieved":"Review recommended";
 document.getElementById("app").innerHTML=`<div class="wrap"><div class="brand"><div class="mark">A</div>AWS Connect Developer Assessment</div><div class="card result">
 <div class="eyebrow">Assessment summary</div><h1>${esc(COURSE_INFO[state.course].title)}</h1>
 <div class="score">${pct}%</div><h2>${tone}</h2>
 <p class="hint">You answered ${correct} of 50 questions correctly. The benchmark for this assessment is 80%. ${auto?"The timer reached zero, so the assessment was submitted automatically.":""}</p>
 <div class="meta" style="justify-content:center"><span class="pill">${correct}/50 correct</span><span class="pill">50 questions</span><span class="pill">60 minutes</span></div>
 <div style="margin-top:20px"><a href="?course=${state.course}"><button>Take another randomized attempt</button></a></div>
 </div></div>`;
}
 
async function renderAdmin(){
 document.getElementById("app").innerHTML=`<div class="wrap admin"><div class="brand"><div class="mark">A</div>Assessment response console</div>
 <section class="hero"><div class="eyebrow">Training administrator</div><h1>Response export</h1><p>Sign in with a Supabase user that has the admin role, then export all recorded attempts to Excel.</p></section>
 <div id="adminBody"></div></div>`;
 const body=document.getElementById("adminBody");
 if(!sb){body.innerHTML=`<div class="notice">Supabase is not configured in this build. Add your project URL and anon key near the top of this HTML file.</div>`;return}
 body.innerHTML=`<div class="card"><input id="email" placeholder="Admin email"><br><br><input id="password" type="password" placeholder="Password"><br><br><button id="login">Sign in</button><div id="msg" class="small" style="margin-top:10px"></div></div>`;
 document.getElementById("login").onclick=async()=>{
   const {error}=await sb.auth.signInWithPassword({email:document.getElementById("email").value,password:document.getElementById("password").value});
   if(error){document.getElementById("msg").textContent=error.message;return}
   loadAdminRows();
 };
}
async function loadAdminRows(){
 const body=document.getElementById("adminBody");body.innerHTML=`<div class="card"><button id="export">Download Excel</button><div id="table"></div></div>`;
 const {data,error}=await sb.from("assessment_responses").select("*").order("completed_at",{ascending:false});
 if(error){body.querySelector("#table").innerHTML=`<div class="notice">${esc(error.message)}</div>`;return}
 const rows=data||[];
 body.querySelector("#table").innerHTML=`<p class="small">${rows.length} response(s)</p><div class="scroll"><table><thead><tr><th>Name</th><th>Course</th><th>Score</th><th>Percent</th><th>Completed</th><th>Duration</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.full_name)}</td><td>${esc(r.course)}</td><td>${r.score}/50</td><td>${r.percentage}%</td><td>${esc(r.completed_at||"")}</td><td>${Math.round((r.duration_seconds||0)/60)} min</td></tr>`).join("")}</tbody></table></div>`;
 document.getElementById("export").onclick=()=>{
   const flat=rows.map(r=>({Name:r.full_name,Course:COURSE_INFO[r.course]?.title||r.course,Score:r.score,Percentage:r.percentage,Questions:r.question_count,Started:r.started_at,Completed:r.completed_at,DurationSeconds:r.duration_seconds,AutoSubmitted:r.auto_submitted,QuestionIDs:(r.question_ids||[]).join(" | "),Answers:JSON.stringify(r.answers||{})}));
   const wb=XLSX.utils.book_new();const ws=XLSX.utils.json_to_sheet(flat);XLSX.utils.book_append_sheet(wb,ws,"Responses");XLSX.writeFile(wb,"AWS_Connect_Assessment_Responses.xlsx");
 };
}
route();
</script>
</body></html>
