let parsedQuestions=[];

function normalizeImportedText(text){
  return String(text??'')
    .replace(/^\uFEFF/,'')
    .replace(/\r\n?/g,'\n')
    .replace(/\u00A0/g,' ')
    .replace(/[\u200B-\u200D\u2060\uFEFF]/g,'')
    .replace(/[ \t]+/g,' ')
    .replace(/[ \t]*\n[ \t]*/g,'\n')
    .replace(/\n{3,}/g,'\n\n')
    .trim();
}

function getFileExtension(name){
  const clean=String(name||'').toLowerCase().split('?')[0].split('#')[0];
  const i=clean.lastIndexOf('.');
  return i>=0?clean.slice(i+1):'';
}

async function readTextFile(file){
  const buf=await file.arrayBuffer();
  const bytes=new Uint8Array(buf);

  if(bytes.length>=3&&bytes[0]===0xEF&&bytes[1]===0xBB&&bytes[2]===0xBF){
    return new TextDecoder('utf-8').decode(bytes.subarray(3));
  }
  if(bytes.length>=2&&bytes[0]===0xFF&&bytes[1]===0xFE){
    return new TextDecoder('utf-16le').decode(bytes.subarray(2));
  }
  if(bytes.length>=2&&bytes[0]===0xFE&&bytes[1]===0xFF){
    const swapped=new Uint8Array(bytes.length-2);
    for(let i=2,j=0;i+1<bytes.length;i+=2,j+=2){
      swapped[j]=bytes[i+1];
      swapped[j+1]=bytes[i];
    }
    return new TextDecoder('utf-16le').decode(swapped);
  }

  try{
    return new TextDecoder('utf-8',{fatal:true}).decode(bytes);
  }catch(_){
    return new TextDecoder('windows-1252').decode(bytes);
  }
}

function htmlToAssessmentText(raw){
  const doc=new DOMParser().parseFromString(raw,'text/html');
  doc.querySelectorAll('script,style,noscript,svg,canvas,iframe,template').forEach(x=>x.remove());

  doc.querySelectorAll('br').forEach(el=>el.replaceWith('\n'));
  doc.querySelectorAll('p,div,section,article,header,footer,main,aside,h1,h2,h3,h4,h5,h6,li,tr,dt,dd,blockquote,pre')
    .forEach(el=>el.appendChild(doc.createTextNode('\n')));

  return normalizeImportedText(doc.body?.textContent||doc.documentElement?.textContent||'');
}

function markdownToAssessmentText(raw){
  let t=normalizeImportedText(raw);

  t=t.replace(/^\s*```[^\n]*$/gm,'');
  t=t
    .replace(/^\s{0,3}#{1,6}\s+/gm,'')
    .replace(/^\s*>\s?/gm,'')
    .replace(/^\s*[-*+]\s+(?=(?:Question\s+\d+|\d+\s*[\.\)]|[A-D]\s*[\.\):\-]|(?:Correct\s+)?Answer\s*:))/gmi,'')
    .replace(/\*\*([^*\n]+)\*\*/g,'$1')
    .replace(/__([^_\n]+)__/g,'$1')
    .replace(/\[([^\]]+)\]\([^)]+\)/g,'$1')
    .replace(/^\s*(?:---+|\*\*\*+|___+)\s*$/gm,'');

  return normalizeImportedText(t);
}

function pdfTextToLines(items){
  const rows=[];
  for(const item of items){
    const str=String(item.str||'').trim();
    if(!str)continue;
    const y=item.transform?.[5]??0;
    let row=rows.find(r=>Math.abs(r.y-y)<2);
    if(!row){row={y,parts:[]};rows.push(row)}
    row.parts.push({x:item.transform?.[4]??0,str});
  }
  rows.sort((a,b)=>b.y-a.y);
  return rows.map(r=>r.parts.sort((a,b)=>a.x-b.x).map(p=>p.str).join(' ')).join('\n');
}

async function extractQuestionBankText(file){
  const ext=getFileExtension(file.name);

  if(ext==='docx'){
    if(!window.mammoth)throw new Error('DOCX reader library is not available.');
    const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});
    return normalizeImportedText(r.value);
  }

  if(ext==='pdf'){
    if(!window.pdfjsLib)throw new Error('PDF reader library is not available.');
    const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    let out='';
    for(let p=1;p<=pdf.numPages;p++){
      const page=await pdf.getPage(p);
      const tc=await page.getTextContent();
      out+='\n'+pdfTextToLines(tc.items);
    }
    return normalizeImportedText(out);
  }

  if(['md','markdown','html','htm','txt'].includes(ext)){
    const raw=await readTextFile(file);
    if(!raw.trim())throw new Error('The selected file is empty or contains no readable text.');
    if(ext==='html'||ext==='htm')return htmlToAssessmentText(raw);
    if(ext==='md'||ext==='markdown')return markdownToAssessmentText(raw);
    return normalizeImportedText(raw);
  }

  throw new Error('Unsupported file type. Use .docx, .pdf, .md, .html/.htm, or .txt.');
}

async function parseUpload(file){
  if(!file)return;
  const st=document.getElementById('parseStatus');
  st.className='status';
  st.textContent='Reading and validating question bank…';
  st.classList.remove('hidden');
  parsedQuestions=[];

  try{
    const text=await extractQuestionBankText(file);
    parsedQuestions=parseQuestions(text);

    const diagnostics=validateParsedQuestions(parsedQuestions);
    if(!parsedQuestions.length){
      throw new Error('No valid questions detected. Expected four options A-D and an Answer: A/B/C/D line for each question.');
    }
    if(diagnostics.length){
      throw new Error('Question validation failed: '+diagnostics.slice(0,5).join(' | '));
    }

    st.className='status good';
    st.textContent=`✓ ${parsedQuestions.length} questions detected and validated from ${file.name}`;

    const nameEl=document.getElementById('aname');
    if(parsedQuestions.length&&!nameEl.value){
      nameEl.value=file.name.replace(/\.(docx|pdf|md|markdown|html|htm|txt)$/i,'');
    }
  }catch(e){
    parsedQuestions=[];
    st.className='status bad';
    st.textContent='Could not import file: '+e.message;
  }
}

function parseQuestions(rawText){
  let text=normalizeImportedText(rawText);

  text=text
    .replace(/\s+(?=(?:Question\s+\d+\b))/gi,'\n')
    .replace(/\s+(?=[A-D]\s*[\.\):\-]\s+)/g,'\n')
    .replace(/\s+(?=(?:Correct\s+)?Answer\s*[:\-]\s*[A-D]\b)/gi,'\n');

  const lines=text.split('\n').map(x=>x.trim()).filter(Boolean);
  const out=[];
  let current=null;
  let activeOption=null;

  const save=()=>{
    if(!current)return;
    current.question=current.question.trim();
    current.options=current.options.map(x=>x.trim());

    if(
      current.question &&
      current.options.length===4 &&
      current.options.every(Boolean) &&
      Number.isInteger(current.answer) &&
      current.answer>=0 &&
      current.answer<=3
    ){
      out.push({
        question:current.question,
        options:current.options,
        answer:current.answer
      });
    }
    current=null;
    activeOption=null;
  };

  for(const line of lines){
    const qm=line.match(/^(?:Question\s*)?(\d+)\s*(?:[\.\):\-]\s*)?(.*)$/i);

    if(qm){
      const explicit=/^Question\s*/i.test(line);
      const delimited=new RegExp('^\\s*'+qm[1]+'\\s*[\\.\\)]\\s+').test(line);
      if(explicit||delimited){
        save();
        current={
          sourceNumber:Number(qm[1]),
          question:(qm[2]||'').trim(),
          options:['','','',''],
          answer:null
        };
        continue;
      }
    }

    if(!current)continue;

    const om=line.match(/^([A-D])\s*[\.\):\-]\s*(.+)$/i);
    if(om){
      activeOption='ABCD'.indexOf(om[1].toUpperCase());
      current.options[activeOption]=om[2].trim();
      continue;
    }

    const am=line.match(/^(?:Correct\s+)?Answer\s*[:\-]\s*([A-D])(?:\b|$)/i);
    if(am){
      current.answer='ABCD'.indexOf(am[1].toUpperCase());
      activeOption=null;
      continue;
    }

    if(activeOption!==null){
      current.options[activeOption]=(current.options[activeOption]+' '+line).trim();
    }else if(!current.options.some(Boolean)&&current.answer===null){
      current.question=(current.question+' '+line).trim();
    }
  }

  save();

  const seen=new Set();
  return out.filter(q=>{
    const key=(q.question+'\u0000'+q.options.join('\u0000')+'\u0000'+q.answer).toLowerCase();
    if(seen.has(key))return false;
    seen.add(key);
    return true;
  });
}

function validateParsedQuestions(questions){
  const issues=[];
  questions.forEach((q,i)=>{
    if(!q.question?.trim())issues.push(`Question ${i+1}: missing question text`);
    if(!Array.isArray(q.options)||q.options.length!==4||q.options.some(x=>!String(x||'').trim())){
      issues.push(`Question ${i+1}: must contain exactly four non-empty options`);
    }
    if(!Number.isInteger(q.answer)||q.answer<0||q.answer>3){
      issues.push(`Question ${i+1}: invalid answer`);
    }
  });
  return issues;
}

async function removeAssessment(id,name){
  if(!needSb())return;

  const label=name||'this assessment';
  const ok=confirm(
    `Remove "${label}"?\n\nThis will permanently delete the assessment, its questions, and all recorded responses. This action cannot be undone.`
  );
  if(!ok)return;

  try{
    // Delete child records first so this also works when database foreign keys
    // are not configured with ON DELETE CASCADE.
    let r=await sb.from('assessment_responses').delete().eq('assessment_id',id);
    if(r.error)throw r.error;

    r=await sb.from('assessment_questions').delete().eq('assessment_id',id);
    if(r.error)throw r.error;

    r=await sb.from('assessments').delete().eq('id',id);
    if(r.error)throw r.error;

    await loadAdminData();
    setTimeout(()=>toast(`Removed "${label}".`),50);
  }catch(e){
    toast('Could not remove assessment: '+e.message,true);
  }
}

function wordXmlEsc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}
function wordRun(text,bold=false,size=22){return `<w:r><w:rPr>${bold?'<w:b/>':''}<w:sz w:val="${size}"/><w:szCs w:val="${size}"/></w:rPr><w:t xml:space="preserve">${wordXmlEsc(text)}</w:t></w:r>`}
function wordParagraph(text,{bold=false,size=22,spaceAfter=120,center=false}={}){return `<w:p><w:pPr>${center?'<w:jc w:val="center"/>':''}<w:spacing w:after="${spaceAfter}"/></w:pPr>${wordRun(text,bold,size)}</w:p>`}
async function downloadWord(id){
  if(typeof JSZip==='undefined')return toast('Word export library did not load. Refresh the page and try again.',true);
  try{
    const [{data:a,error:ae},{data:qs,error:qe}]=await Promise.all([
      sb.from('assessments').select('name,description,question_count,questions_per_attempt,time_limit_minutes,benchmark_percentage').eq('id',id).single(),
      sb.from('assessment_questions').select('question_number,question,option_a,option_b,option_c,option_d,correct_answer').eq('assessment_id',id).order('question_number')
    ]);
    if(ae)throw ae;
    if(qe)throw qe;
    if(!qs||!qs.length)return toast('No questions found for this assessment.',true);
    let body='';
    body+=wordParagraph(a?.name||'Assessment Questions',{bold:true,size:34,spaceAfter:100,center:true});
    body+=wordParagraph('Assessment Question Bank',{bold:true,size:24,spaceAfter:240,center:true});
    if(a?.description)body+=wordParagraph(a.description,{size:20,spaceAfter:180});
    body+=wordParagraph(`Total Questions: ${qs.length}`,{bold:true,size:20,spaceAfter:60});
    body+=wordParagraph(`Questions per Attempt: ${a?.questions_per_attempt??''}`,{size:20,spaceAfter:60});
    body+=wordParagraph(`Time Limit: ${a?.time_limit_minutes??''} minutes`,{size:20,spaceAfter:60});
    body+=wordParagraph(`Benchmark: ${a?.benchmark_percentage??''}%`,{size:20,spaceAfter:260});
    qs.forEach((q,i)=>{
      const n=q.question_number??(i+1);
      const opts=[q.option_a,q.option_b,q.option_c,q.option_d];
      const ans=Number(q.correct_answer);
      body+=wordParagraph(`Question ${n}`,{bold:true,size:23,spaceAfter:80});
      body+=wordParagraph(q.question,{size:22,spaceAfter:100});
      opts.forEach((o,j)=>{body+=wordParagraph(`${'ABCD'[j]}. ${o??''}`,{size:21,spaceAfter:45})});
      body+=wordParagraph(`Correct Answer: ${Number.isInteger(ans)&&ans>=0&&ans<4?'ABCD'[ans]:'-'}`,{bold:true,size:21,spaceAfter:240});
    });
    const documentXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`;
    const contentTypes=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`;
    const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
    const zip=new JSZip();
    zip.file('[Content_Types].xml',contentTypes);
    zip.folder('_rels').file('.rels',rels);
    zip.folder('word').file('document.xml',documentXml);
    const blob=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');
    link.href=url;
    link.download=`${slug(a?.name||'assessment')}-questions.docx`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast(`Downloaded ${qs.length} questions in Word format.`);
  }catch(e){toast('Word export failed: '+e.message,true)}
}

function renderError(m){document.getElementById('app').innerHTML=`<div class="shell"><div class="card"><div class="status bad">${esc(m)}</div></div></div>`}
async function candidateHome(){if(!needSb())return renderError('Add your Supabase publishable/anon key in index.html.');const {data,error}=await sb.from('assessments').select('*').eq('published',true).order('name');if(error)return renderError(error.message);document.getElementById('app').innerHTML=`<div class="shell"><div class="top"><div><div class="brand">AWS Developer Assessments</div><div class="muted">Choose an assessment</div></div><button class="btn ghost" onclick="location.search='?admin=1'">Admin</button></div><div class="grid">${data.map(a=>`<div class="card"><div class="badge">ASSESSMENT</div><h2>${esc(a.name)}</h2><p class="muted">${esc(a.description||'')}</p><div class="stats"><span>${a.questions_per_attempt} Questions</span><span>•</span><span>${a.time_limit_minutes} min</span><span>•</span><span>${a.benchmark_percentage}% Benchmark</span></div><button class="btn" style="margin-top:16px" onclick="startAssessment('${a.id}')">Start assessment</button></div>`).join('')}</div></div>`}
async function startAssessment(id){const {data:a,error}=await sb.from('assessments').select('*').eq('id',id).eq('published',true).single();if(error)return toast(error.message,true);const {data:qs,error:e}=await sb.from('assessment_questions').select('*').eq('assessment_id',id).order('question_number');if(e)return toast(e.message,true);if(!qs||qs.length<a.questions_per_attempt)return toast('This assessment does not have enough questions.',true);state.assessment=a;state.questions=[...qs];if(a.shuffle_questions)state.questions.sort(()=>Math.random()-.5);state.questions=state.questions.slice(0,a.questions_per_attempt);state.questions=state.questions.map(q=>{let opts=[q.option_a,q.option_b,q.option_c,q.option_d],answer=q.correct_answer;if(a.shuffle_options){const pairs=opts.map((o,i)=>({o,i})).sort(()=>Math.random()-.5);answer=pairs.findIndex(x=>x.i===answer);opts=pairs.map(x=>x.o)}return {...q,options:opts,answer}});state.answers=[];state.index=0;state.name='';state.startedAt=null;state.submitted=false;renderStart()}
function renderStart(){const a=state.assessment;document.getElementById('app').innerHTML=`<div class="candidate shell"><div class="card"><div class="badge">ASSESSMENT</div><h1 class="title">${esc(a.name)}</h1><p class="muted">${esc(a.description||'')}</p><div class="stats"><span>${a.questions_per_attempt} questions</span><span>•</span><span>${a.time_limit_minutes} minutes</span><span>•</span><span>${a.benchmark_percentage}% Benchmark</span></div><div class="field"><label>Full name</label><input id="candidateName" placeholder="Enter your full name"></div><button class="btn" onclick="beginAssessment()">Begin assessment</button></div></div>`}
function beginAssessment(){const n=document.getElementById('candidateName').value.trim();if(!n)return toast('Enter your full name.',true);state.name=n;state.startedAt=Date.now();renderQuestion();}
function renderQuestion(){const a=state.assessment,q=state.questions[state.index],answered=state.answers.filter(x=>x!==undefined).length;const pct=(state.index+1)/state.questions.length*100;document.getElementById('app').innerHTML=`<div class="shell candidate"><div class="top"><div><div class="brand">${esc(a.name)}</div><div class="muted">${answered}/${a.questions_per_attempt} answered</div></div><div id="timer" class="timer"></div></div><div class="progress"><div style="width:${pct}%"></div></div><div class="card"><div class="muted">Question ${state.index+1} of ${state.questions.length}</div><h2>${esc(q.question)}</h2>${q.options.map((o,i)=>`<div class="choice" style="${state.answers[state.index]===i?'border-color:#5b5cf0;background:#f2f3ff':''}" onclick="choose(${i})"><b>${'ABCD'[i]}.</b> ${esc(o)}</div>`).join('')}</div><div class="actions"><button class="btn ghost" ${state.index?'':'disabled'} onclick="prevQ()">Previous</button><button class="btn" onclick="nextQ()">${state.index===state.questions.length-1?'Submit':'Next'}</button></div></div>`;tick()}
function choose(i){state.answers[state.index]=i;renderQuestion()}
function prevQ(){if(state.index>0){state.index--;renderQuestion()}}
function nextQ(){if(state.index<state.questions.length-1){state.index++;renderQuestion()}else submitAssessment(false)}
function tick(){clearInterval(state.timer);const end=state.startedAt+state.assessment.time_limit_minutes*60000;const go=()=>{const left=Math.max(0,end-Date.now());const el=document.getElementById('timer');if(el)el.textContent=`${String(Math.floor(left/60000)).padStart(2,'0')}:${String(Math.floor(left/1000)%60).padStart(2,'0')}`;if(left<=0){clearInterval(state.timer);submitAssessment(true)}};go();state.timer=setInterval(go,1000)}
async function submitAssessment(auto){if(state.submitted)return;state.submitted=true;clearInterval(state.timer);let correct=0;state.questions.forEach((q,i)=>{if(state.answers[i]===q.answer)correct++});const pct=Math.round(correct/state.questions.length*100);const row={assessment_id:state.assessment.id,full_name:state.name,course:state.assessment.slug,score:correct,percentage:pct,question_count:state.questions.length,started_at:new Date(state.startedAt).toISOString(),completed_at:new Date().toISOString(),duration_seconds:Math.round((Date.now()-state.startedAt)/1000),auto_submitted:auto,question_ids:state.questions.map(q=>q.id),answers:state.answers};const {error}=await sb.from('assessment_responses').insert(row);if(error){state.submitted=false;return renderError('Submission failed: '+error.message)}document.getElementById('app').innerHTML=`<div class="candidate shell"><div class="card center"><div class="badge">COMPLETED</div><h1 class="title">Assessment complete</h1><div class="metric">${pct}%</div><h2>${pct>=state.assessment.benchmark_percentage?'Benchmark achieved':'Review recommended'}</h2><p class="muted">You answered ${correct} of ${state.questions.length} correctly. Benchmark: ${state.assessment.benchmark_percentage}%.</p><button class="btn" onclick="location.href=location.pathname">Return to assessments</button></div></div>`}

function initBackgroundSparkles(){
  const layer=document.getElementById('bgSparkles');
  if(!layer)return;
  const reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
  const whiteCount=reduced?8:18;
  const orangeCount=reduced?5:9;

  function addSpark(orange=false){
    const s=document.createElement('span');
    s.className='bg-spark'+(orange?' orange':'');
    s.style.left=(2+Math.random()*96)+'%';
    s.style.top=(2+Math.random()*96)+'%';
    s.style.animationDelay=(Math.random()*4)+'s';
    s.style.animationDuration=(3+Math.random()*3)+'s';
    layer.appendChild(s);
  }

  for(let i=0;i<whiteCount;i++)addSpark(false);
  for(let i=0;i<orangeCount;i++)addSpark(true);
}

function boot(){const isAdmin=new URLSearchParams(location.search).get('admin')==='1';if(isAdmin)adminPage();else candidateHome()}
initBackgroundSparkles();
boot();
</script></body></html>
