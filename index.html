<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWS Assessment Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root {
  --bg: #e0e8f0;
  --text: #2d3748;
  --muted: #718096;
  --brand: #5b5cf0;
  --brand-light: #7c3aed;
  --good: #0e9f6e;
  --danger: #f05252;
  
  /* Neumorphic Shadows */
  --shadow-light: #ffffff;
  --shadow-dark: #b8c4d8;
  --neu-flat: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
  --neu-flat-sm: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
  --neu-pressed: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
}

* {
  box-sizing: border-box;
  transition: all 0.2s ease-in-out;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  color: var(--text);
  background-color: var(--bg);
  padding: 2rem;
}

/* Layout Containers */
.container {
  max-width: 1200px;
  margin: 0 auto;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1.5rem 2rem;
  border-radius: 20px;
  background: var(--bg);
  box-shadow: var(--neu-flat);
  margin-bottom: 2rem;
}

.header h1 {
  margin: 0;
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--text);
}

/* Neumorphic Components */
.neu-card {
  background: var(--bg);
  box-shadow: var(--neu-flat);
  border-radius: 20px;
  padding: 1.5rem;
  margin-bottom: 1.5rem;
  border: 1px solid rgba(255, 255, 255, 0.4);
}

.neu-inset {
  background: var(--bg);
  box-shadow: var(--neu-pressed);
  border-radius: 12px;
  padding: 0.8rem 1.2rem;
  border: none;
  outline: none;
  color: var(--text);
  width: 100%;
}

.neu-btn {
  background: var(--bg);
  box-shadow: var(--neu-flat-sm);
  border-radius: 12px;
  border: none;
  padding: 0.8rem 1.5rem;
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
}

.neu-btn:hover {
  box-shadow: 2px 2px 5px var(--shadow-dark), -2px -2px 5px var(--shadow-light);
}

.neu-btn:active {
  box-shadow: var(--neu-pressed);
  color: var(--brand);
}

.neu-btn-primary {
  color: var(--brand);
  font-weight: 700;
}

/* Stats Grid */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1.5rem;
  margin-bottom: 2rem;
}

.stat-card {
  text-align: center;
}

.stat-value {
  font-size: 2rem;
  font-weight: 800;
  color: var(--brand);
  margin-top: 0.5rem;
}

/* Form Controls & Search */
.controls-bar {
  display: flex;
  gap: 1rem;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}

.search-input {
  flex: 1;
  min-width: 250px;
}

/* File Drop Zone */
.drop-zone {
  border: 2px dashed #b8c4d8;
  border-radius: 16px;
  padding: 2.5rem;
  text-align: center;
  background: var(--bg);
  box-shadow: var(--neu-pressed);
  cursor: pointer;
  margin-bottom: 1.5rem;
}

.drop-zone:hover {
  border-color: var(--brand);
}

/* Table Styling */
.table-container {
  overflow-x: auto;
  border-radius: 16px;
}

table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0 0.8rem;
}

th {
  padding: 1rem;
  color: var(--muted);
  font-weight: 600;
  text-align: left;
}

td {
  padding: 1rem;
  background: var(--bg);
  box-shadow: var(--neu-flat-sm);
}

td:first-child {
  border-radius: 12px 0 0 12px;
}

td:last-child {
  border-radius: 0 12px 12px 0;
}

/* Status Badges */
.badge {
  padding: 0.4rem 0.8rem;
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: 600;
  box-shadow: var(--neu-pressed);
  display: inline-block;
}

.badge-good { color: var(--good); }
.badge-danger { color: var(--danger); }
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <header class="header">
    <h1>AWS Assessment Manager</h1>
    <button class="neu-btn neu-btn-primary">+ New Assessment</button>
  </header>

  <!-- Metrics Grid -->
  <div class="stats-grid">
    <div class="neu-card stat-card">
      <span style="color: var(--muted);">Total Audits</span>
      <div class="stat-value">24</div>
    </div>
    <div class="neu-card stat-card">
      <span style="color: var(--muted);">Compliant Controls</span>
      <div class="stat-value" style="color: var(--good);">92%</div>
    </div>
    <div class="neu-card stat-card">
      <span style="color: var(--muted);">Action Items</span>
      <div class="stat-value" style="color: var(--danger);">7</div>
    </div>
  </div>

  <!-- Document Upload Section -->
  <div class="neu-card">
    <h3 style="margin-top:0; margin-bottom:1rem;">Import Evidence</h3>
    <div class="drop-zone">
      <p style="margin:0; color: var(--muted);">Drag & Drop assessment files (.xlsx, .pdf, .docx) or click to browse</p>
    </div>
  </div>

  <!-- Assessment Data Table -->
  <div class="neu-card">
    <div class="controls-bar">
      <input type="text" class="neu-inset search-input" placeholder="Search AWS controls, IDs, or services...">
      <button class="neu-btn">Filter</button>      <button class="neu-btn">Export</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Control ID</th>
            <th>Service</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>S3-001</strong></td>
            <td>Amazon S3</td>
            <td><span class="badge badge-good">Compliant</span></td>
            <td><button class="neu-btn" style="padding: 0.4rem 0.8rem;">Review</button></td>
          </tr>
          <tr>
            <td><strong>IAM-004</strong></td>
            <td>AWS IAM</td>
            <td><span class="badge badge-danger">Non-Compliant</span></td>
            <td><button class="neu-btn" style="padding: 0.4rem 0.8rem;">Remediate</button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

</body>
</html>
